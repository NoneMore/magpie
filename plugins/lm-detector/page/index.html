<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型指纹检测</title>
<link rel="stylesheet" href="style.css">
<script src="_magpie/bridge.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<header><div><h1>模型指纹检测</h1><p class="muted">通过 Magpie Gateway 直接采样，在插件后台运行 LM Detector 算法。</p></div><span class="pill">LM Detector</span></header>
<section class="panel">
<label for="provider">Provider</label><select id="provider"><option>加载中…</option></select>
<label for="model">模型</label><select id="model"><option>加载中…</option></select>
<label for="format">API 协议</label>
<select id="format"><option value="responses">OpenAI Responses</option><option value="chat">Chat Completions</option></select>
<label for="stream"><input type="checkbox" id="stream" checked> 流式采样（SSE，推荐）</label>
<div class="config-grid">
  <div><label for="effort">推理强度（-e / --effort）</label>
    <input type="text" id="effort" maxlength="64" placeholder="不发送（如 low、high 或自定义值）"></div>
  <div><label for="timeout">超时（--timeout，秒）</label>
    <input type="number" id="timeout" min="0.1" max="600" step="0.1" value="120" required></div>
  <div><label for="count">每轮样本数（--count）</label>
    <select id="count"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select></div>
  <div><label for="parallel">每轮并发数（-p / --parallel）</label>
    <select id="parallel"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select></div>
  <div><label for="repeat">检测轮数（-n / --repeat）</label>
    <input type="number" id="repeat" min="1" max="20" step="1" value="1" required></div>
  <div class="strict-option"><label for="strict"><input type="checkbox" id="strict"> 严格模式（-s / --strict）</label>
    <small>需要 3 个样本；不自动截断，必须完整正常结束。</small></div>
</div>
<div class="buttons"><button class="primary" id="run" disabled>开始检测</button><button id="cancel" hidden>取消检测</button><button id="reload">刷新模型</button></div>
<div class="status" role="status" aria-live="polite"><i id="dot"></i><span id="message">正在连接…</span><span id="elapsed"></span></div>
</section>
<section class="panel" id="resultSection" hidden>
<div class="headrow"><h2>检测结果</h2><small id="sampleCount"></small></div>
<label for="roundResult">查看轮次</label><select id="roundResult"></select>
<p class="muted" id="roundNotice"></p>
<p id="distributionWarning" class="distribution-warning" role="alert" hidden></p>
<div class="winner"><small>最相似候选</small><strong id="winner">—</strong><div id="winnerNote" class="muted"></div></div>
<div class="table"><table><thead><tr><th>候选模型</th><th>闭集概率</th><th>相对分数</th></tr></thead><tbody id="results"></tbody></table></div>
<details><summary>诊断信息</summary><pre id="diagnostics"></pre></details>
</section>
<p class="muted note">检测每轮向所选模型发送 1–3 条长整数挑战，多轮检测会增加费用（最多 20 轮）。置信度仅是参考库内的闭集相对概率，不能证明实际模型身份。动态路由或 fallback 会影响可靠性。</p>
</body>
</html>
