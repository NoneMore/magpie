name: Built-in fingerprint CI

on:
  pull_request:
    paths:
      - '.github/workflows/builtin-fingerprint.yml'
      - 'plugins/fingerprint/**'
      - 'plugins/all/all.go'
      - 'internal/fingerprint/**'
      - 'internal/gui/fingerprint.go'
      - 'internal/gui/api.go'
      - 'internal/gui/assets/plugins/fingerprint/**'
      - 'internal/gui/assets/index.html'
      - 'internal/gui/assets/i18n.js'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    name: Fingerprint / Go 1.26 + JS
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify pinned lm-detector package installs and launches
        timeout-minutes: 8
        run: bun x --bun lmfpd@0.0.1792416845676 --help
      - name: JavaScript syntax
        run: |
          node --check internal/gui/assets/plugins/fingerprint/client.js
          node --check internal/gui/assets/plugins/fingerprint/i18n.js
      - name: Go formatting
        run: |
          bad=$(gofmt -l internal/fingerprint/fingerprint*.go internal/gui/fingerprint.go plugins/fingerprint/fingerprint.go)
          test -z "$bad" || { echo "Need gofmt: $bad"; exit 1; }
      - name: Vet
        run: go vet -tags nogui ./internal/fingerprint ./plugins/fingerprint ./internal/gui
      - name: Unit and UI-integrity tests
        run: go test -tags nogui -count=1 ./internal/fingerprint ./plugins/fingerprint ./internal/gui
      - name: Build terminal Magpie
        env:
          CGO_ENABLED: '0'
        run: go build -tags nogui -o /tmp/magpie-fingerprint .

  windows:
    name: Windows desktop (x64 / ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle pinned lmfpd classifier and calibrated reference data
        timeout-minutes: 8
        run: |
          mkdir -p dist/fingerprint-engine
          echo "Current published lmfpd version: $(npm view lmfpd version)"
          npm install --prefix dist/fingerprint-engine --no-audit --no-fund --ignore-scripts --omit=dev lmfpd@0.0.1792416845676
          find dist/fingerprint-engine/node_modules/lmfpd -maxdepth 3 -type f | head -35
          node -e "const p=require('./dist/fingerprint-engine/node_modules/lmfpd/package.json');if(p.version!=='0.0.1792416845676')process.exit(1)"
          test -s dist/fingerprint-engine/node_modules/lmfpd/bin/fpd.js
          ls -lh dist/fingerprint-engine/node_modules/lmfpd/data || true
          test -s dist/fingerprint-engine/node_modules/lmfpd/data/shared_detector.bin
          test -s dist/fingerprint-engine/node_modules/lmfpd/data/unified_bank.json
      - name: Build Windows GUI using project's release target
        env:
          CGO_ENABLED: '0'
        run: |
          make release-windows VERSION=0.0.0
          test -s dist/magpie-windows-amd64.exe
          test -s dist/magpie-windows-arm64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: magpie-builtin-fingerprint-windows
          path: |
            dist/magpie-windows-*.exe
            dist/fingerprint-engine/**
          retention-days: 14
