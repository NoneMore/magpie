name: Daily Upstream Sync

# Check upstream once a day; never overwrite fork-only commits.
on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC, once daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream into fork
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/yetone/magpie.git
          git fetch --no-tags upstream main

          count=$(git rev-list --count HEAD..upstream/main)
          echo "Upstream commits to merge: $count"
          if [[ "$count" == "0" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Stop on conflicts. Never hard-reset or force-push this fork.
          git merge --no-edit upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        if: steps.merge.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Full Windows gate before push
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: ./.github/scripts/test-windows.ps1

      - name: Push tested merge
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # A concurrent push makes this non-force push fail safely.
          git push origin HEAD:main

      - name: Trigger Windows-only fork release
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_sha="$(git rev-parse HEAD)"
