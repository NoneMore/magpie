name: Daily Upstream Sync

# Check upstream once a day; never overwrite fork-only commits.
on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC, once daily
  workflow_dispatch:
  push:
    # Updating this policy starts Sync once; regular fork commits do not.
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js for safe merge
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Merge upstream into fork
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/yetone/magpie.git
          git fetch --no-tags upstream main

          count=$(git rev-list --count HEAD..upstream/main)
          echo "Upstream commits to merge: $count"
          if [[ "$count" == "0" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve only allowlisted, strictly verified conflicts; never silently
          # discard fork behavior. Other conflicts still stop before testing/push.
          if git merge --no-edit upstream/main; then
            echo "Upstream merged without conflicts."
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ ${#conflicts[@]} -eq 1 &&
                  "${conflicts[0]}" == "internal/gui/core_budget_test.go" ]]; then
              echo "::notice::Resolving upstream-owned core JS size budget policy from upstream."
              git checkout --theirs -- internal/gui/core_budget_test.go
              git add -- internal/gui/core_budget_test.go
              GIT_EDITOR=true git merge --continue
            elif [[ ${#conflicts[@]} -eq 1 &&
                    "${conflicts[0]}" == "internal/gui/assets/app.js" ]]; then
              # Resolve only this verified Caller Prompt vs Subagent Model row conflict.
              # Any unexpected change to either side will stop without pushing.
              node <<'NODE'
          const fs = require('node:fs');
          const file = 'internal/gui/assets/app.js';
          const source = fs.readFileSync(file, 'utf8');
          const pattern = /^<<<<<<<[^\r\n]*\r?\n([\s\S]*?)^=======\r?\n([\s\S]*?)^>>>>>>>[^\r\n]*(?:\r?\n|$)/gm;
          const blocks = [...source.matchAll(pattern)];
          const ourLine = '  codex: ["codexCallerPromptRow", "codexAgentsV1Row", "fullContextRow", "codexAsyncRow", "codexTitlesRow", "codexDescriptionsRow", "codexPredictionsRow", "codexAutoReviewRow", "codexMemoriesRow"],';
          const theirLine = '  codex: ["codexAgentsV1Row", "codexSubagentModelRow", "fullContextRow", "codexAsyncRow", "codexTitlesRow", "codexDescriptionsRow", "codexPredictionsRow", "codexAutoReviewRow", "codexMemoriesRow"],';
          const normalize = s => s.replace(/\r/g, '').trim();
          if (blocks.length !== 1 || normalize(blocks[0][1]) !== normalize(ourLine)
              || normalize(blocks[0][2]) !== normalize(theirLine)) {
            throw Error('Unexpected app.js conflict; refusing unsafe resolution');
          }
          const resolved = ourLine.replace('"codexAgentsV1Row"', '"codexAgentsV1Row", "codexSubagentModelRow"');
          const result = source.replace(blocks[0][0], resolved + '\n');
          if (/^(<<<<<<<|=======|>>>>>>>)/m.test(result)) throw Error('Unresolved merge markers');
          fs.writeFileSync(file, result);
          console.log('Resolved known AGENT_PREFS.codex row, preserving both features');
          NODE
              node --check internal/gui/assets/app.js
              git add -- internal/gui/assets/app.js
              GIT_EDITOR=true git merge --continue
            else
              printf 'Unsafe merge conflicts; no push: %s\\n' "${conflicts[*]}" >&2
              exit 1
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        if: steps.merge.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Full Windows gate before push
        if: steps.merge.outputs.changed == 'true'
        shell: pwsh
        run: ./.github/scripts/test-windows.ps1

      - name: Push tested merge
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # A concurrent push makes this non-force push fail safely.
          git push origin HEAD:main

      - name: Trigger Windows-only fork release
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_sha="$(git rev-parse HEAD)"
