name: LM Detector native plugin

on:
  push:
    paths:
      - 'plugins/lm-detector/**'
      - '.github/workflows/lm-detector.yml'
  pull_request:
    paths:
      - 'plugins/lm-detector/**'
      - '.github/workflows/lm-detector.yml'

jobs:
  test-native-detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reference data package
        working-directory: plugins/lm-detector
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Show installed reference-data version
        working-directory: plugins/lm-detector
        run: npm ls lmfpd --depth=0
      - name: Run direct-detector core tests
        working-directory: plugins/lm-detector
        run: bun test tests/*.test.ts
      - name: Check backend and Page JavaScript syntax
        run: node --check plugins/lm-detector/index.js && node --check plugins/lm-detector/page/app.js
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go built-in plugin import invariants
        env:
          CGO_ENABLED: '0'
        run: go test -tags nogui -run TestPluginsImportOnlyCore -count=1 ./internal/pluginrt
      - name: Gateway + Bun host integration (mock upstream)
        timeout-minutes: 8
        env:
          CGO_ENABLED: '0'
        run: go test -tags 'nogui lm_detector_e2e' -run TestLMDetectorGatewayBunIntegration -count=1 -v -timeout 4m ./plugins/lm-detector
