name: LM Detector native plugin

on:
  push:
    paths:
      - 'plugins/lm-detector/**'
      - '.github/workflows/lm-detector.yml'
      - '.github/scripts/prepare-lm-detector.mjs'
      - 'internal/cli/bundled_lm_detector.go'
      - 'internal/cli/main.go'
      - 'internal/plugin/bundled*.go'
      - 'internal/plugin/bundled-lm-detector/**'
  pull_request:
    paths:
      - 'plugins/lm-detector/**'
      - '.github/workflows/lm-detector.yml'

jobs:
  test-native-detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned build-time reference data
        run: node .github/scripts/prepare-lm-detector.mjs
      - name: Run direct-detector core tests
        working-directory: plugins/lm-detector
        run: bun test tests/*.test.ts
      - name: Check backend and Page JavaScript syntax
        run: node --check plugins/lm-detector/index.js && node --check plugins/lm-detector/page/app.js
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test offline bundle registration and upgrades
        env:
          CGO_ENABLED: '0'
          LM_DETECTOR_REQUIRED: '1'
        run: go test -tags nogui -count=1 ./internal/plugin -run '^(TestBundled|TestMaterialize|TestPreparedBundle)'
      - name: Check Go built-in plugin import invariants
        env:
          CGO_ENABLED: '0'
        run: go test -tags nogui -run TestPluginsImportOnlyCore -count=1 ./internal/pluginrt
      - name: Gateway + Bun host integration (mock upstream)
        timeout-minutes: 8
        env:
          CGO_ENABLED: '0'
        run: go test -tags 'nogui lm_detector_e2e' -run TestLMDetectorGatewayBunIntegration -count=1 -v -timeout 4m ./plugins/lm-detector
