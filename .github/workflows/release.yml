name: Fork Windows Release

# Never delegate to yetone/magpie-releases: its builds omit fork changes.
# Direct main pushes: publish only after the Test workflow succeeds.
# Daily sync: its runner tests before pushing, then dispatches this workflow.
on:
  workflow_run:
    workflows: ['Test']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional fork commit SHA (defaults to current branch)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fork-windows-release
  cancel-in-progress: false

jobs:
  windows:
    # Never release code from a PR, a failed test, or a different repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Checkout fork revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Require release commit to be on fork main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release source is not a commit on fork main" >&2
            exit 1
          }
          # Do not publish stale commits when older Test runs finish late.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]] &&
             [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; skip this obsolete release."
          fi

      - name: Identify immutable release
        if: steps.source.outputs.stale != 'true'
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          tag="fork-${sha:0:12}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.source.outputs.stale != 'true' && steps.meta.outputs.exists != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        if: steps.source.outputs.stale != 'true' && steps.meta.outputs.exists != 'true' && github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        if: steps.source.outputs.stale != 'true' && steps.meta.outputs.exists != 'true' && github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Automatic release already passed Test (direct push) or the sync gate.
      # An owner-started manual release is verified here before publishing.
      - name: Gate manually requested Windows releases
        if: steps.source.outputs.stale != 'true' && steps.meta.outputs.exists != 'true' && github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]'
        shell: pwsh
        run: ./.github/scripts/test-windows.ps1

      - name: Build Windows desktop and CLI (x64 / ARM64)
        if: steps.source.outputs.stale != 'true' && steps.meta.outputs.exists != 'true'
        shell: pwsh
        env:
          FORK_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          # Same .syso resource generation used by the upstream Makefile.
          go run github.com/tc-hib/go-winres@v0.3.3 make --in build/windows/winres.json --arch amd64,arm64 --out rsrc --file-version 0.0.0 --product-version 0.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            go build -tags production -trimpath -ldflags "-s -w -X main.version=$env:FORK_TAG -H windowsgui" -o "dist/magpie-windows-$arch.exe" .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "dist/magpie-windows-$arch.exe" -DestinationPath "dist/magpie-windows-$arch.zip" -Force
          }

          Remove-Item rsrc_windows_*.syso -ErrorAction SilentlyContinue
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            go build -tags nogui -trimpath -ldflags "-s -w -X main.version=$env:FORK_TAG" -o "dist/magpie-cli-windows-$arch.exe" .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding utf8 dist/SHA256SUMS.txt

      - name: Publish Windows binaries to this fork
        if: steps.source.outputs.stale != 'true' && steps.meta.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_TAG: ${{ steps.meta.outputs.tag }}
          FORK_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Unofficial Windows build of **NoneMore/magpie**, built from this fork's own source.

          Commit: ${FORK_SHA}

          - Desktop: magpie-windows-amd64.exe (x64) / magpie-windows-arm64.exe (ARM64)
          - CLI: magpie-cli-windows-amd64.exe / magpie-cli-windows-arm64.exe
          - ZIP archives and SHA256SUMS.txt are also provided.
          - Binaries are **not code-signed**; Windows SmartScreen may show a warning.
          - This fork's releases are separate from the upstream self-update feed.
          - Source: https://github.com/NoneMore/magpie/commit/${FORK_SHA}
          EOF
          gh release create "$FORK_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$FORK_SHA" --title "Magpie Fork $FORK_TAG" --notes-file notes.md --latest
