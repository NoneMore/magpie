name: Fork Windows Release

# Never delegate to yetone/magpie-releases: its builds omit fork changes.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional full fork commit SHA (defaults to checked-out ref)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fork-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout fork revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Identify immutable release
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          tag="fork-${sha:0:12}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.meta.outputs.exists != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        if: steps.meta.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        if: steps.meta.outputs.exists != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Full Windows gate before release
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        run: ./.github/scripts/test-windows.ps1

      - name: Build Windows desktop and CLI (x64 / ARM64)
        if: steps.meta.outputs.exists != 'true'
        shell: pwsh
        env:
          FORK_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          # Same .syso resource generation used by the upstream Makefile.
          go run github.com/tc-hib/go-winres@v0.3.3 make --in build/windows/winres.json --arch amd64,arm64 --out rsrc --file-version 0.0.0 --product-version 0.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            go build -tags production -trimpath -ldflags "-s -w -X main.version=$env:FORK_TAG -H windowsgui" -o "dist/magpie-windows-$arch.exe" .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "dist/magpie-windows-$arch.exe" -DestinationPath "dist/magpie-windows-$arch.zip" -Force
          }

          Remove-Item rsrc_windows_*.syso -ErrorAction SilentlyContinue
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            go build -tags nogui -trimpath -ldflags "-s -w -X main.version=$env:FORK_TAG" -o "dist/magpie-cli-windows-$arch.exe" .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding utf8 dist/SHA256SUMS.txt

      - name: Publish Windows binaries to this fork
        if: steps.meta.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_TAG: ${{ steps.meta.outputs.tag }}
          FORK_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Unofficial Windows build of **NoneMore/magpie**, built from this fork's own source.

          Commit: ${FORK_SHA}

          - Desktop: magpie-windows-amd64.exe (x64) / magpie-windows-arm64.exe (ARM64)
          - CLI: magpie-cli-windows-amd64.exe / magpie-cli-windows-arm64.exe
          - ZIP archives and SHA256SUMS.txt are also provided.
          - Binaries are **not code-signed**; Windows SmartScreen may show a warning.
          - This fork's releases are separate from the upstream self-update feed.
          - Source: https://github.com/NoneMore/magpie/commit/${FORK_SHA}
          EOF
          gh release create "$FORK_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$FORK_SHA" --title "Magpie Fork $FORK_TAG" --notes-file notes.md --latest
